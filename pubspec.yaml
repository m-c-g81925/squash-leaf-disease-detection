name: squash_disease
description: Squash Leaf Disease Detection with Planting Calendar Application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.0.0
  firebase_auth: ^6.2.0

  # Calendar
  table_calendar: ^3.0.9

  # Camera and image selection
  camera: ^0.10.5+9
  image_picker: ^1.0.7

  # Local profile picture storage
  path_provider: ^2.1.6

  # On-device TensorFlow Lite inference
  tflite_flutter: ^0.12.1
  image: ^4.8.0

  # Kept for compatibility in case another feature still uses HTTP
  http: ^1.2.1

  # Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/model.tflite
    - assets/models/labels.txt